<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="light">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400&display=swap">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/favicon.png?v=3" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; }
  /* Layout: single column of sections, max 1440, 12-col grid for bio / services / clients,
     availability pinned to the bottom of the viewport. Values from Figma node 109:18. */
  :root {
    /* Figma variables: semantic color */
    --bg-default: #f0f2ec;          /* bg/default */
    --bg-none: rgba(255, 255, 255, 0); /* bg/none */
    --bg-strong: #d8e4ea;           /* bg/strong */
    --bg-knockout: #0066da;         /* bg/knockout */
    --bg-knockout-strong: #0052ae;  /* bg/knockout-strong */
    --content-default: #0066da;     /* content/default */
    --content-strong: #2d37ac;      /* content/strong */
    --content-knockout: #f0f2ec;    /* content/knockout */
    --border-default: #0066da;      /* border/default */
    --border-subtle: #7caefa;       /* border/subtle */

    /* Text styles: default / small */
    --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --text-default: 400 18px/24px var(--font);
    --text-small: 400 16px/20px var(--font);

    /* Figma variables: viewport */
    --page-margin: 40px;            /* viewport/page/margin */
    --content-max-width: 1440px;    /* viewport/content/max-width */
    --section-gap: 80px;
  }

  body {
    background: var(--bg-default);
    color: var(--content-default);
    font: var(--text-default);
  }

  .page {
    box-sizing: border-box;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--section-gap);
    padding-block: var(--page-margin);
    padding-left: max(var(--page-margin), env(safe-area-inset-left, 0px));
    padding-right: max(var(--page-margin), env(safe-area-inset-right, 0px));
  }

  .section { width: 100%; max-width: var(--content-max-width); }

  p { margin: 0; }

  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--border-subtle); outline-offset: 2px; }

  /* Header */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .masthead h1 { margin: 0; font: var(--text-default); }

  /* Heading: each word fades in, 600ms, staggered 100ms */
  .title .word {
    display: inline-block;
    animation: word-fade 600ms ease-out both;
    animation-delay: calc(var(--i) * 100ms);
  }
  @keyframes word-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .button {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    padding: 11px 15px; /* Figma 12px 16px with an inside 1px stroke */
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    background: var(--bg-none);
    color: var(--content-default);
    font: var(--text-default);
    text-decoration: none;
    white-space: nowrap;
    transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  /* Button states from the Figma "button" component: default / hover / active */
  .button:hover,
  .button:active {
    background: var(--bg-knockout);
    border-color: var(--border-default);
    color: var(--content-knockout);
  }
  .button:active { background: var(--bg-knockout-strong); }

  /* Content grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 24px;
    row-gap: 40px;
  }
  .col {
    min-width: 0;
    border-top: 1px solid var(--border-subtle);
    padding-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  .bio { grid-column: span 6; }
  .services, .clients { grid-column: span 3; }

  .col h2 { margin: 0; font: var(--text-default); }

  .bio-text p + p { margin-top: 10px; } /* default style paragraph spacing */

  .bio-text a {
    text-decoration: underline;
    text-decoration-color: var(--border-subtle);
    text-decoration-thickness: from-font;
    text-underline-position: from-font;
    text-decoration-skip-ink: none;
  }
  .bio-text a:hover { text-decoration: underline; text-decoration-color: var(--content-default); }

  .tags {
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 3px 5px; /* Figma 4px 6px with an inside 1px stroke */
    border: 1px solid var(--border-subtle);
    font: var(--text-small);
    white-space: nowrap;
  }
  a.tag { text-decoration: none; transition: border-color 150ms ease; }
  a.tag:hover { border-color: var(--border-default); }

  /* Availability */
  .availability {
    flex: 1 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 8px;
  }
  /* "arrow-right 1" (Figma 109:35): 40 × 16 frame, 40 × 11 arrow centred */
  .arrow { display: flex; align-items: center; width: 40px; height: 16px; flex-shrink: 0; }
  .arrow img { display: block; transform: translateY(-2px); }
  .status {
    /* "dynamic" style: thick bg/hover underline that reads as a highlight */
    text-decoration: underline solid var(--bg-strong);
    line-height: 1.25; /* "dynamic" style still uses 125% in Figma */
    text-decoration-thickness: 22px;
    text-underline-offset: -16px;
    text-decoration-skip-ink: none;
    white-space: nowrap;
  }

  @media (max-width: 1023px) {
    .bio { grid-column: span 12; }
    .services, .clients { grid-column: span 6; }
  }
  @media (max-width: 639px) {
    :root { --page-margin: 16px; --section-gap: 56px; }
    .services, .clients { grid-column: span 12; }
  }
  @media (prefers-reduced-motion: reduce) {
    .button, a.tag { transition: none; }
    .title .word { animation: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="section masthead">
    <h1 class="title">{{HEADING}}</h1>
    <a class="button" href="mailto:{{EMAIL}}">{{EMAIL_LABEL}}</a>
  </header>

  <main class="section grid">
    <section class="col bio" aria-label="About">
      <div class="bio-text">
{{BIO}}
      </div>
    </section>

    <section class="col services">
      <h2>{{SERVICES_TITLE}}</h2>
      <ul class="tags">
{{SERVICES}}
      </ul>
    </section>

    <section class="col clients">
      <h2>{{CLIENTS_TITLE}}</h2>
      <ul class="tags">
{{CLIENTS}}
      </ul>
    </section>
  </main>

  <footer class="section availability">
    <p>{{AVAILABILITY_LABEL}}</p>
    <span class="arrow" aria-hidden="true"><img src="assets/arrow-right.svg" width="40" height="11" alt=""></span>
    <p class="status">{{AVAILABILITY}}</p>
  </footer>
</div>
</body>
</html>
