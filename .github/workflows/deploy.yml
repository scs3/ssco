name: Build and deploy

on:
  push:
    branches: [main]
  # "Site → Publish to website" in the Google Sheet sends this event.
  repository_dispatch:
    types: [sheet-publish]
  # Run it by hand from the Actions tab.
  workflow_dispatch:
  # Daily safety net in case a publish is missed (13:00 UTC = 8am Dallas, CDT).
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build from Google Sheet
        run: node scripts/build.mjs
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
